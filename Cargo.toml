[workspace]
resolver = "2"
members = ["crates/e2e", "crates/game"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
# xbuild also uses this profile for building android AABs because I couldn't find a configuration for it
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "webgpu",
    "wayland",
    "x11",
    "zstd_rust",
] }
bevy_kira_audio = { version = "0.26.0", features = ["ogg"] }
bevy_asset_loader = { version = "0.27.0" }
bevy_egui = { version = "0.42.0", default-features = false, features = ["render", "default_fonts"] }

## This greatly improves WGPU's performance due to its heavy use of trace! calls
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
# Enable browser entropy for crates using getrandom on WASM.
getrandom = { version = "0.4", features = ["wasm_js"] }
